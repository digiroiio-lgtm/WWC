<!doctype html>
<html lang="tr">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa Bulunamadı | Şef Rotası</title>
  <meta name="description" content="Aradığınız sayfa bulunamadı. Ana sayfaya dönmek için tıklayın.">
  <meta name="robots" content="noindex, nofollow">
  <style>
:root{--gold:#c7a86d;--text:#f5f1e8;--muted:#cfc8bb}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f1ea;color:#1f2430;min-height:100vh;display:flex;flex-direction:column}
a{color:#8b5e1a;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.hero{background:linear-gradient(135deg,#12151d 0%,#1c2230 55%,#2a1f16 100%);color:var(--text);padding:72px 0 56px;flex:1;display:flex;align-items:center}
.hero .wrap{width:100%}
.kicker{letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;color:var(--gold);font-weight:700;margin-bottom:14px}
.hero h1{font-size:clamp(3rem,8vw,6rem);line-height:1;margin:0 0 8px;font-weight:800;color:var(--gold)}
.hero h2{font-size:clamp(1.4rem,3vw,2rem);margin:0 0 16px;color:var(--text)}
.hero p{max-width:600px;font-size:1.05rem;color:var(--muted);margin:0 0 28px}
.buttons{display:flex;flex-wrap:wrap;gap:12px}
.button{display:inline-block;padding:12px 22px;border-radius:999px;border:1px solid var(--gold);background:var(--gold);color:#16181d;font-weight:700}
.button.secondary{background:transparent;color:var(--text)}
footer{background:#10131a;color:#d6d1c8;padding:20px 0;text-align:center;font-size:.9rem}
footer a{color:#c7a86d}
@media(max-width:720px){.hero{padding:48px 0}}
</style>
</head>
<body>
  <div class="hero">
    <div class="wrap">
      <div class="kicker">Şef Rotası</div>
      <h1>404</h1>
      <h2>Sayfa Bulunamadı</h2>
      <p>Aradığınız sayfa mevcut değil veya taşınmış olabilir. Ana sayfaya dönerek devam edebilirsiniz.</p>
      <div class="buttons">
        <a class="button" href="/">Ana Sayfa</a>
        <a class="button secondary" href="/blog/">Blog</a>
        <a class="button secondary" href="/iletisim/">İletişim</a>
      </div>
    </div>
  </div>
  <footer>
    <div class="wrap">
      <p>© 2026 Şef Rotası · <a href="/gizlilik-politikasi/">Gizlilik Politikası</a> · <a href="/iletisim/">İletişim</a></p>
    </div>
  </footer>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
